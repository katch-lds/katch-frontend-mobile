name: katch_mobile
description: Katch — aplicação móvel do Candidato (I120).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.4.0
  # Armazenamento seguro da credencial de sessão (I075; modelo de classes, secção 6).
  flutter_secure_storage: ^9.2.4
  # Material Design, separado do SDK desde o Flutter 3.47 (package:flutter/material.dart depreciado).
  material_ui: ^1.11.0
  file_selector: ^1.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
