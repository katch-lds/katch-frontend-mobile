org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.newDsl=false
android.builtInKotlin=false
# Compilação incremental do Kotlin desligada (I077): no Windows, com o projeto e a cache do pub em discos diferentes
# (por exemplo, D: e C:), os plugins com código Kotlin (file_selector_android) falham com "different roots".
kotlin.incremental=false
